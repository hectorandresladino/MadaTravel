name: 01 - Validacion de codigo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Probar y compilar backend Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Ejecutar pruebas y compilar JAR
        run: mvn -B -f backend/pom.xml clean verify
  frontend:
    name: Compilar frontend React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compilar React
        working-directory: frontend
        env:
          VITE_API_URL: https://api-ejemplo.azurewebsites.net
        run: npm run build
