server:
  port: ${PORT:8080}

spring:
  application:
    name: agencia-viajes-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agencia_viajes}
    username: ${DB_USER:viajes}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
