services:
  postgres:
    image: postgres:16-alpine
    container_name: agencia-viajes-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: agencia_viajes
      POSTGRES_USER: viajes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debe configurar DB_PASSWORD en .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - viajes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajes -d agencia_viajes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  viajes_pgdata:
